[build]
  command = "python3 tools/build.py --check"
  publish = "site"

# Keep submissions off until Forms detection and Gmail notifications are configured.
# Then set EMVALUE_FORMS_ENABLED=true in Netlify's environment and redeploy.
# Set EMVALUE_SITE_URL to the canonical https:// hostname to enable search indexing.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# These URLs include a content hash in ?v=. A changed file gets a new URL.
# Cache in the visitor's browser to avoid repeat transfers and requests.
# HTML keeps Netlify's default revalidation so page and form updates stay fresh.
[[headers]]
  for = "/assets/hub.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/hub.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/enquiry.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/brand/emvalue-wordmark.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/box-sprite.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
