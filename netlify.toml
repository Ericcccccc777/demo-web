[build]
  command = "python3 tools/build.py --check"
  publish = "site"

# EMVALUE_FORMS_ENABLED=true is set in Netlify's environment, where Forms detection and the Gmail
# notification are configured.

# Production only, so Deploy Previews stay out of search: the live address for canonical and hreflang
# links, sitemap.xml and robots.txt.
[context.production.environment]
  EMVALUE_SITE_URL = "https://emvalue.com.au"

# One address for the site. Netlify already sends www.emvalue.com.au and emvalue.au to it;
# these hostnames are served as they are unless redirected.
[[redirects]]
  from = "https://www.emvalue.au/*"
  to = "https://emvalue.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.emvalue.au/*"
  to = "https://emvalue.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://emvalue.netlify.app/*"
  to = "https://emvalue.com.au/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Netlify doesn't send HSTS for custom domains: browsers then always use https.
    Strict-Transport-Security = "max-age=31536000"

# These URLs include a content hash in ?v=. A changed file gets a new URL.
# Cache in the visitor's browser to avoid repeat transfers and requests.
# HTML keeps Netlify's default revalidation so page and form updates stay fresh.
[[headers]]
  for = "/assets/hub.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/hub.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/enquiry.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/box-sprite.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
